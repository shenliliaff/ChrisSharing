<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>读书笔记 | fengsKB</title>
    <link rel="icon" href="reading-icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="https://unpkg.com/docsify@4/lib/themes/vue.css" />
    <style>
      .sidebar .app-name img {
        display: inline-block;
        width: 28px;
        height: 28px;
        margin-right: 8px;
        vertical-align: middle;
      }
    </style>
  </head>
  <body>
    <div id="app">加载中...</div>
    <script>
      window.$docsify = {
        name: '<img src="reading-icon.svg" alt="" aria-hidden="true" /> fengsKB 读书笔记',
        repo: "https://github.com/shenliliaff/shenliliaff.github.io",
        homepage: "README.md",
        loadNavbar: true,
        loadSidebar: true,
        subMaxLevel: 3,
        search: {
          maxAge: 86400000,
          paths: [
            "/reading/README.md",
            "/reading/2026-09-10-south-sudan-civil-war.md",
            "/reading/2026-09-09-animal-farm-george-orwell.md",
            "/reading/2026-09-03-the-year-of-1587.md",
            "/reading/2026-09-02-the-world-i-see-fei-fei-li.md",
          ],
          depth: 3,
          placeholder: "搜索读书笔记",
          noData: "没有找到匹配的笔记",
        },
        plugins: [
          function (hook) {
            hook.beforeEach(function (content) {
              return content.replace(/^---\r?\n[\s\S]*?\r?\n---\r?\n*/, "");
            });
          },
        ],
      };

      window.addEventListener("keydown", function (event) {
        if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "k") {
          const searchInput = document.querySelector(".search input");

          if (searchInput instanceof HTMLInputElement) {
            event.preventDefault();
            searchInput.focus();
          }
        }
      });
    </script>
    <script src="https://unpkg.com/docsify@4"></script>
    <script src="https://unpkg.com/docsify@4/lib/plugins/search.min.js"></script>
  </body>
</html>
